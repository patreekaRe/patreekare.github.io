<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Patrick Rosal | Walk Through My Studio</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --cream: #fefae0;
      --ink: #283618;
      --olive: #606c38;
      --rust: #bc6c25;
      --tan: #dda15e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: "Poppins", sans-serif;
      background: var(--cream);
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }

    canvas { display: block; }

    .proto-badge {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 20;
      background: var(--ink);
      color: var(--cream);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .proto-badge a {
      color: var(--tan);
      text-decoration: none;
      font-weight: 600;
    }

    .proto-badge a:hover { text-decoration: underline; }

    .controls-hint {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      background: rgba(40, 54, 24, 0.85);
      color: var(--cream);
      font-size: 0.78rem;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      max-width: 220px;
    }

    .controls-hint strong { color: var(--tan); }

    .label {
      font-family: "Roboto Slab", serif;
      font-weight: 700;
      color: var(--ink);
      background: var(--cream);
      border: 2px solid var(--tan);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
      pointer-events: none;
      transform: translateY(-10px);
    }

    .prompt {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      z-index: 20;
      background: var(--ink);
      color: var(--cream);
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .prompt kbd {
      background: var(--tan);
      color: var(--ink);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: inherit;
      font-weight: 700;
      margin-right: 0.4rem;
    }

    .panel-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(40, 54, 24, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 1.5rem;
    }

    .panel-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      background: white;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 2.25rem;
      box-shadow: 0 20px 45px rgba(40, 54, 24, 0.35);
      transform: translateY(16px);
      transition: transform 0.25s ease, max-width 0.25s ease;
    }

    .panel.wide {
      max-width: 640px;
    }

    .panel-overlay.open .panel {
      transform: translateY(0);
    }

    .panel .eyebrow {
      color: var(--rust);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      display: block;
    }

    .panel h2 {
      font-family: "Roboto Slab", serif;
      margin-bottom: 0.75rem;
    }

    .panel p {
      color: #3a4a2a;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .panel-close {
      display: inline-block;
      margin-top: 0.5rem;
      background: var(--rust);
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .panel-close:hover { background: #a35a1c; }

    .spotify-player {
      margin-bottom: 0;
    }

    .crate-sheet {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      width: min(460px, calc(100% - 1.5rem));
      transform: translate(-50%, 130%);
      background: white;
      border-radius: 20px;
      padding: 1rem 1.1rem 1.1rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      z-index: 25;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .crate-sheet.open {
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .crate-sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .crate-eyebrow {
      display: block;
      color: var(--rust);
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .crate-sheet h2 {
      font-family: "Roboto Slab", serif;
      font-size: 1.15rem;
    }

    .crate-close {
      background: var(--cream);
      border: 2px solid var(--tan);
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
    }

    .crate-hint {
      font-size: 0.72rem;
      color: var(--olive);
      margin-bottom: 0.6rem;
    }

    .browsing .touch-controls,
    .browsing .mobile-hint,
    .browsing .controls-hint {
      display: none;
    }

    .browsing .prompt {
      opacity: 0 !important;
    }

    .spotify-player iframe {
      display: block;
    }

    .spotify-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.7rem;
    }

    .spotify-controls button {
      background: var(--cream);
      border: 2px solid var(--tan);
      color: var(--ink);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-weight: 600;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .spotify-controls button:hover {
      background: var(--tan);
    }

    .spotify-controls span {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--olive);
    }

    .computer-screen {
      margin-bottom: 1rem;
      border-radius: 14px;
      overflow: hidden;
      background: #1c140c;
      border: 6px solid #1c140c;
    }

    .computer-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.5rem 0.7rem;
    }

    .computer-bar span.dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .computer-bar .dot-red { background: #e0605a; }
    .computer-bar .dot-yellow { background: #e3b341; }
    .computer-bar .dot-green { background: #5fb26a; }

    .computer-bar .computer-title {
      margin-left: 0.5rem;
      color: rgba(254, 250, 224, 0.55);
      font-size: 0.72rem;
      font-family: monospace;
    }

    .computer-list {
      background: var(--cream);
      max-height: 44vh;
      overflow-y: auto;
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.6rem;
    }

    .computer-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }

    .computer-card:hover {
      transform: translateY(-3px);
    }

    .computer-card img {
      width: 100%;
      height: 78px;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .computer-card .card-body {
      padding: 0.55rem 0.6rem 0.7rem;
    }

    .computer-card h4 {
      font-size: 0.78rem;
      font-family: "Roboto Slab", serif;
      color: var(--rust);
      margin-bottom: 0.2rem;
    }

    .computer-card p {
      font-size: 0.68rem;
      color: #5a4a35;
      line-height: 1.35;
      margin: 0;
    }

    .touch-controls {
      display: none;
    }

    .joystick {
      position: fixed;
      left: 1.5rem;
      bottom: 1.5rem;
      z-index: 20;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: rgba(40, 54, 24, 0.35);
      border: 2px solid rgba(254, 250, 224, 0.35);
      touch-action: none;
    }

    .joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      background: rgba(221, 161, 94, 0.9);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .interact-btn {
      position: fixed;
      right: 1.5rem;
      bottom: 2.1rem;
      z-index: 20;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(188, 108, 37, 0.88);
      border: 2px solid rgba(254, 250, 224, 0.5);
      color: var(--cream);
      font-family: "Roboto Slab", serif;
      font-weight: 700;
      font-size: 1.3rem;
      touch-action: none;
    }

    .interact-btn:active,
    .joystick:active {
      filter: brightness(1.1);
    }

    .mobile-hint {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      background: rgba(40, 54, 24, 0.85);
      color: var(--cream);
      font-size: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      max-width: 160px;
      text-align: right;
      display: none;
    }

    @media (max-width: 700px), (pointer: coarse) {
      .touch-controls { display: block; }
      .controls-hint { display: none; }
      .mobile-hint { display: block; }
    }

    @supports (bottom: env(safe-area-inset-bottom)) {
      .joystick { bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
      .interact-btn { bottom: calc(2.1rem + env(safe-area-inset-bottom)); }
      .proto-badge, .controls-hint, .mobile-hint { top: calc(1rem + env(safe-area-inset-top)); }
    }

    #fade {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #100b06;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    #fade.visible {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 1.6rem;
        border-radius: 16px;
      }

      .panel h2 {
        font-size: 1.3rem;
      }

      .proto-badge {
        font-size: 0.62rem;
        padding: 0.4rem 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="proto-badge">&larr; <a href="index.html">Back to site</a></div>
    <div class="controls-hint">
      <strong>WASD / Arrows</strong> to walk<br>
      <strong>E</strong> to interact<br>
      <span id="hint-text">Walk to the house and press E</span>
    </div>

    <div class="prompt" id="prompt"><kbd>E</kbd><span id="prompt-text">Interact</span></div>

    <div class="mobile-hint">Drag to walk<br>Tap the button to interact</div>

    <div class="touch-controls">
      <div class="joystick" id="joystick">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <button class="interact-btn" id="interactBtn">E</button>
    </div>

    <div id="fade"></div>

    <div class="panel-overlay" id="panelOverlay">
      <div class="panel" id="panelBox">
        <span class="eyebrow" id="panelEyebrow">Section</span>
        <h2 id="panelTitle">Title</h2>
        <p id="panelBody">Body copy.</p>

        <div class="computer-screen" id="computerScreen" hidden>
          <div class="computer-bar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="computer-title">coursework/</span>
          </div>
          <div class="computer-list" id="computerList"></div>
        </div>

        <button class="panel-close" id="panelClose">Close</button>
      </div>
    </div>

    <div class="crate-sheet" id="crateSheet">
      <div class="crate-sheet-head">
        <div>
          <span class="crate-eyebrow">Independent work</span>
          <h2>Music &amp; Production</h2>
        </div>
        <button class="crate-close" id="crateClose" type="button" aria-label="Close">&#10005;</button>
      </div>
      <p class="crate-hint">Flip through the crate &mdash; &larr; / &rarr; or the buttons.</p>
      <div class="spotify-player" id="spotifyPlayer">
        <iframe
          id="spotifyFrame"
          style="border-radius: 12px"
          width="100%"
          height="152"
          frameborder="0"
          allowfullscreen=""
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
          title="Spotify player"></iframe>
        <div class="spotify-controls">
          <button id="spotifyPrev" type="button" aria-label="Previous song">&larr; Prev</button>
          <span id="spotifyIndex">1 / 1</span>
          <button id="spotifyNext" type="button" aria-label="Next song">Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="world.js"></script>
</body>
</html>
